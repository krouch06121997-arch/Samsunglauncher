<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern OS Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Phone Container for Preview */
        .phone-container {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 932px;
            background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        @media (min-width: 434px) {
            .phone-container {
                border-radius: 45px;
                border: 12px solid #222;
                height: 90vh;
            }
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }

        .dynamic-island {
            width: 110px;
            height: 28px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        .camera-dot {
            width: 11px;
            height: 11px;
            background: #111;
            border-radius: 50%;
            border: 1px solid #333;
        }

        /* Main Screen Layout */
        .screen-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .screen-content::-webkit-scrollbar {
            display: none;
        }

        /* Widgets Grid */
        .widget-row {
            display: flex;
            gap: 16px;
        }

        .widget {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 16px;
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .clock-widget {
            align-items: center;
            text-align: center;
            min-height: 140px;
        }

        .analog-clock {
            width: 90px;
            height: 90px;
            border: 3px solid #fff;
            border-radius: 50%;
            position: relative;
            margin-bottom: 8px;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            background: #fff;
            border-radius: 4px;
        }

        .hour-hand { width: 4px; height: 24px; background: #fff; transform: translateX(-50%) rotate(30deg); }
        .minute-hand { width: 3px; height: 35px; background: #ddd; transform: translateX(-50%) rotate(120deg); }
        .second-hand { width: 1px; height: 40px; background: #ff3b30; transform: translateX(-50%) rotate(200deg); }

        .calendar-widget .month {
            color: #ff3b30;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            font-size: 11px;
            text-align: center;
            margin-top: 8px;
        }

        .calendar-grid span {
            padding: 2px;
        }

        .calendar-grid .active {
            background: #ff3b30;
            color: #fff;
            border-radius: 50%;
        }

        /* App Grid / App Library */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 10px 0;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .app-icon:active {
            transform: scale(0.9);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .app-name {
            font-size: 12px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        /* Dock */
        .dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            margin: 12px 16px 24px 16px;
            padding: 12px;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dock .icon-box {
            width: 56px;
            height: 56px;
        }

        /* Control Center Overlay */
        .control-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 100;
            transform: translateY(-100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 50px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-center.open {
            transform: translateY(0);
        }

        .cc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .cc-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cc-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .cc-toggle.active {
            background: #007aff;
            color: #fff;
        }

        .close-cc {
            align-self: center;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Status Bar -->
        <div class="status-bar" onclick="toggleControlCenter()">
            <span id="current-time">3:27</span>
            <div class="dynamic-island">
                <div class="camera-dot"></div>
                <div style="font-size: 10px; color: #00ffcc;">●</div>
            </div>
            <div>5G 🔋 9%</div>
        </div>

        <!-- Main Screen -->
        <div class="screen-content">
            <!-- Widgets Row -->
            <div class="widget-row">
                <div class="widget clock-widget">
                    <div class="analog-clock">
                        <div class="hand hour-hand"></div>
                        <div class="hand minute-hand"></div>
                        <div class="hand second-hand"></div>
                    </div>
                    <span style="font-size: 11px; opacity: 0.8;">Analog Clock</span>
                </div>
                <div class="widget calendar-widget">
                    <div class="month">June</div>
                    <div class="calendar-grid">
                        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                        <span></span><span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                        <span class="active">7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span>
                    </div>
                </div>
            </div>

            <!-- App Grid -->
            <div class="app-grid">
                <div class="app-icon" onclick="openApp('App Store')">
                    <div class="icon-box" style="background: linear-gradient(135deg, #00c6ff, #0072ff);"></div>
                    <span class="app-name">App Store</span>
                </div>
                <div class="app-icon" onclick="openApp('Settings')">
                    <div class="icon-box" style="background: #555;">⚙️</div>
                    <span class="app-name">Settings</span>
                </div>
                <div class="app-icon" onclick="openApp('Photos')">
                    <div class="icon-box" style="background: linear-gradient(135deg, #f12711, #f5af19);">🖼️</div>
                    <span class="app-name">Photos</span>
                </div>
                <div class="app-icon" onclick="openApp('Files')">
                    <div class="icon-box" style="background: #2193b0;">📁</div>
                    <span class="app-name">Files</span>
                </div>
                <div class="app-icon" onclick="openApp('Weather')">
                    <div class="icon-box" style="background: linear-gradient(135deg, #36d1dc, #5b86e5);">⛅</div>
                    <span class="app-name">Weather</span>
                </div>
                <div class="app-icon" onclick="openApp('Health')">
                    <div class="icon-box" style="background: #ff2d55;">❤️</div>
                    <span class="app-name">Health</span>
                </div>
                <div class="app-icon" onclick="openApp('Map')">
                    <div class="icon-box" style="background: #34c759;">🗺️</div>
                    <span class="app-name">Map</span>
                </div>
                <div class="app-icon" onclick="openApp('Clock')">
                    <div class="icon-box" style="background: #111;">⏰</div>
                    <span class="app-name">Clock</span>
                </div>
            </div>
        </div>

        <!-- Dock Bar -->
        <div class="dock">
            <div class="app-icon" onclick="openApp('Phone')">
                <div class="icon-box" style="background: #34c759;">📞</div>
            </div>
            <div class="app-icon" onclick="openApp('Messages')">
                <div class="icon-box" style="background: #007aff;">💬</div>
            </div>
            <div class="app-icon" onclick="openApp('Calculator')">
                <div class="icon-box" style="background: #ff9500;">🧮</div>
            </div>
            <div class="app-icon" onclick="openApp('Camera')">
                <div class="icon-box" style="background: #8e8e93;">📷</div>
            </div>
        </div>

        <!-- Control Center Panel -->
        <div class="control-center" id="controlCenter">
            <h2>Control Center</h2>
            <div class="cc-grid">
                <div class="cc-box">
                    <div class="cc-toggle active" id="wifiToggle" onclick="toggleBtn('wifiToggle')">wifi</div>
                    <span>Wi-Fi / Bluetooth</span>
                </div>
                <div class="cc-box">
                    <div class="cc-toggle" id="darkToggle" onclick="toggleBtn('darkToggle')">🌙</div>
                    <span>Dark Mode</span>
                </div>
            </div>
            <button class="close-cc" onclick="toggleControlCenter()">Close</button>
        </div>
    </div>

    <script>
        // Update Time
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Control Center toggle
        function toggleControlCenter() {
            const cc = document.getElementById('controlCenter');
            cc.classList.toggle('open');
        }

        function toggleBtn(id) {
            document.getElementById(id).classList.toggle('active');
        }

        function appName(name) {
            alert('Opening ' + name);
        }
    </script>
</body>
</html>
