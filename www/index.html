<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Style Custom Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container -->
    <div class="launcher-container">
        
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="current-time">9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋 100%</span>
            </div>
        </div>

        <!-- Home Screen / Standby Clock Widget -->
        <div class="widget-section">
            <div class="standby-clock">
                <h1 id="clock-number">10:45</h1>
                <p id="date-text">Thursday, October 15</p>
            </div>
        </div>

        <!-- App Grid (App Library Style) -->
        <div class="app-grid">
            <div class="app-item">
                <div class="app-icon" style="background: #007aff;">📞</div>
                <span>Phone</span>
            </div>
            <div class="app-item">
                <div class="app-icon" style="background: #34c759;">💬</div>
                <span>Messages</span>
            </div>
            <div class="app-item">
                <div class="app-icon" style="background: #ff9500;">📷</div>
                <span>Camera</span>
            </div>
            <div class="app-item">
                <div class="app-icon" style="background: #af52de;">⚙️</div>
                <span>Settings</span>
            </div>
            <div class="app-item">
                <div class="app-icon" style="background: #ff3b30;">🎵</div>
                <span>Music</span>
            </div>
            <div class="app-item">
                <div class="app-icon" style="background: #5856d6;">📁</div>
                <span>Files</span>
            </div>
        </div>

        <!-- Dock Bar -->
        <div class="dock-bar">
            <div class="app-icon" style="background: #34c759;">📞</div>
            <div class="app-icon" style="background: #007aff;">🌐</div>
            <div class="app-icon" style="background: #ff9500;">💬</div>
            <div class="app-icon" style="background: #5856d6;">📷</div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
